name: Deploy Gestão Vinícola Brasília

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SITE_URL: https://www.vinicolabrasilia.com.br/gestao

jobs:
  web-deploy:
    name: FTP Deploy Gestão
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Baixando o código atualizado
      uses: actions/checkout@v4

    - name: 🔍 Conferindo a sintaxe do PHP
      run: |
        erros=0
        for f in $(git ls-files '*.php'); do
          php -l "$f" > /dev/null || erros=$((erros + 1))
        done
        if [ "$erros" -gt 0 ]; then
          echo "::error::$erros arquivo(s) PHP com erro de sintaxe. Nada foi enviado."
          exit 1
        fi

    # O inc/config.php (dados do banco e do e-mail) existe só no servidor: não está no
    # repositório e fica fora do envio. Comprovantes e arquivos de importação também.
    - name: 🚀 Enviando arquivos via FTP para a HostGator
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
        server-dir: ./ # A conta FTP já abre dentro de public_html/gestao
        exclude: |
          **/.git*
          **/.git*/**
          .github/**
          sql/**
          README.md
          inc/config.php
          uploads/comprovantes/**
          uploads/importacoes/**

    - name: 🩺 Conferindo se o sistema está no ar
      run: |
        http=$(curl -sS -L -o pagina.html -w '%{http_code}' "$SITE_URL/index.php")
        if [ "$http" = "200" ] && grep -q 'Gestão interna' pagina.html; then
          echo "::notice::Sistema no ar: $SITE_URL"
        else
          echo "::error::A tela de login não respondeu como esperado (HTTP $http)."
          head -c 500 pagina.html
          exit 1
        fi
